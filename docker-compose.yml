services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nugi-bali-coffee-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      APP_NAME: Nugi Bali Coffee
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nugi_bali_coffe
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      VITE_APP_NAME: Nugi Bali Coffee
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -lc "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi;
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload"

  node:
    image: node:22-alpine
    container_name: nugi-bali-coffee-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -lc "if [ ! -d node_modules ] || [ ! -f node_modules/.package-lock.json ]; then npm ci --no-audit --no-fund; fi;
      npm run dev -- --host 0.0.0.0 --port 5173"

  mysql:
    image: mysql:8.4
    container_name: nugi-bali-coffee-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: nugi_bali_coffe
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nugi-bali-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
  node_modules: